[project]
name = "gear"
version = "0.1.0"
description = "An AI task-runner agent."
authors = [{ name = "Anurag", email = "yadavanurag1310@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",
    "pydantic>=2.0.0",
    "anthropic>=0.20.0",
    "google-genai>=0.3.0",
    "openai>=1.0.0",
    "playwright>=1.40.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
]

[project.scripts]
gear = "src.core.cli:app"
gear-setup = "src.core.cli:setup"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.setuptools]
packages = [
    "src.config",
    "src.core",
    "src.llm",
    "src.mcp",
    "src.mcp.playwright_mcp",
    "src.mcp.filesystem_mcp",
    "src.mcp.notion_mcp"
]

[tool.setuptools.package-data]
"config" = ["settings.yaml"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

